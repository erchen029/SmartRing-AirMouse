# SmartRing Air Mouse Kconfig Configuration
CONFIG_NCS_SAMPLES_DEFAULTS=y

# 蓝牙基础配置
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SmartRing Mouse"
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# 启用安全管理协议 (SMP / 配对与绑定支持)
CONFIG_BT_SMP=y
CONFIG_BT_SIGNING=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y

# 启用配对信息持久化存储 (解决 Reason 19 自动断开问题)
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH=y

# 启用 HID 服务 (Human Interface Device)
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20
CONFIG_BT_CONN_CTX=y

# 电池与设备信息服务 (BAS & DIS)
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_MANUF="SmartRing"
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1915
CONFIG_BT_DIS_PNP_PID=0xEEEE
CONFIG_BT_DIS_PNP_VER=0x0100

# 传感器与 I2C / BMI270 驱动
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BMI270=y

# GPIO
CONFIG_GPIO=y

# 浮点数运算支持 (用于陀螺仪滤波计算)
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# 堆栈与工作队列
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# 日志输出配置
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SENSOR_LOG_LEVEL_WRN=y
